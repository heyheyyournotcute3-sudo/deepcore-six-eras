[package]
name = "deepcore_server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
deepcore_shared = { workspace = true }
bevy = { workspace = true, features = ["bevy_log", "multi_threaded", "debug"] }
bevy_replicon = { workspace = true, features = ["server"] }
bevy_replicon_renet = { workspace = true, features = ["server"] }
serde = { workspace = true }
postcard = { workspace = true }
zstd = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
