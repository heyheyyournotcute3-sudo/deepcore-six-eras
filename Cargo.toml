[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client", "crates/lobby", "tools/atlas_gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Deepcore contributors"]

# ---------------------------------------------------------------------------
# Pinned dependency set.
# Verified against the crates.io sparse index on 2026-12-06.
#   bevy 0.20.1  <- newest stable that bevy_replicon 0.45.5 supports
#   bevy_replicon 0.45.5, bevy_replicon_renet 0.21.0 (renet 2 / bevy_renet 6)
#   bevy_egui 0.43.1 (egui 0.36)
# ---------------------------------------------------------------------------
[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false }
bevy_replicon = "=0.45.5"
bevy_replicon_renet = "=0.21.0"
bevy_egui = "=0.43.1"
egui = "=0.36.2"
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.3"
postcard = { version = "=1.1.3", features = ["alloc"] }
zstd = "=0.13.3"
noise = "=0.9.0"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
proptest = "=1.12.0"
serde_json = "=1.0.145"

# shared
[workspace.dependencies.deepcore_shared]
path = "crates/shared"

# --- profiles ---------------------------------------------------------------
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
